[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wav-validation"
version = "0.1.0"
description = "Checks each generated WAV before it is stored or scored"
requires-python = ">=3.9"
dependencies = ["numpy", "soundfile"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
