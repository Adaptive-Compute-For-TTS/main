# Proposal for review, not team-approved quality policy or a trained model.
schema_version: patch-nfe-v2
prediction_unit: audio_patch
checkpoint_id: TBD_PIN_EXACT_REVISION
conditioning_id: TBD_PIN_EXACT_SETUP
solver: euler
feature_schema:
  version: text5-plus-patch-index-v1
  names: [character_count, word_count, punctuation_count, digit_count, average_word_length, patch_index]
  hidden_state_features: false
candidate_budgets: [4, 6, 8, 10, 12, 16, 20, 24, 32]
reference_nfe: 32
fallback_nfe: 32
fallback_is_quality_guarantee: false
model:
  type: per_budget_binary_mlp
  input_dim: 6
  hidden_dims: [64, 32]
  output_dim: 9
  dropout: 0.1
  loss: masked_bce_with_logits
  softmax: false
split:
  strategy: grouped_by_prompt_family
  seed: 42
  target_ratios: [0.70, 0.15, 0.15]
  benchmark_54_split_counts: {train: 38, val: 8, test: 8}
  benchmark_54_role: legacy_reference_only
quality:
  label_protocol_version: PENDING_QUALITY_TEAM
  audio_valid_required: true
  no_truncation_required: true
  patch_counterfactual_required: true
  subjective_thresholds: PENDING_HUMAN_CALIBRATION
  wer_delta_max: PENDING_AGREEMENT
  speaker_sim_drop_max: PENDING_AGREEMENT
  threshold_for_inference: PENDING_CALIBRATION
